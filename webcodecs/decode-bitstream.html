<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebCodecs Bitstream Decoder</title>
    <style>
        body { font-family: sans-serif; padding: 20px; max-width: 800px; margin: auto; }
        .control-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input[type="text"], select { width: 100%; padding: 8px; box-sizing: border-box; }
        button { padding: 10px 20px; font-size: 16px; cursor: pointer; background-color: #007bff; color: white; border: none; border-radius: 4px; }
        button:hover { background-color: #0056b3; }
        canvas { border: 1px solid #ccc; max-width: 100%; margin-top: 20px; background-color: #000; }
        #logs { width: 100%; height: 150px; margin-top: 20px; padding: 10px; box-sizing: border-box; font-family: monospace; white-space: pre-wrap; overflow-y: auto; background-color: #f8f9fa; border: 1px solid #ddd; }
    </style>
</head>
<body>

    <h1>WebCodecs Bitstream Decoder</h1>

    <div class="control-group">
        <label for="codecInput">Codec String:</label>
        <select id="codecInput">
            <option value="vp8">VP8</option>
            <option value="vp09.00.10.08">VP9</option>
            <option value="avc1.424033">h264 baseline constrained</option>
            <option value="avc1.420034" selected>h264 baseline</option>
            <option value="avc1.640034">h264 high</option>
            <option value="avc1.4d0034">h264 main</option>
            <option value="avc1.580034">h264 extended</option>
            <option value="hvc1.1.6.L123.00">h265</option>
            <option value="av01.0.04M.08">AV1 lvl4</option>
        </select>
    </div>

    <div class="control-group">
        <label for="chunkingStrategy">Chunking Strategy:</label>
        <select id="chunkingStrategy">
            <option value="split_4byte">Split by 0x00000001 (Default)</option>
            <option value="h264_heuristic">Group into Access Units (H.264 Heuristic)</option>
            <option value="single_chunk">Single Chunk (Entire File)</option>
        </select>
    </div>

    <div class="control-group">
        <label for="fileInput">Bitstream File:</label>
        <input type="file" id="fileInput" accept=".h264,.264,.hevc,.bin,.ivf">
    </div>

    <button id="decodeButton">Decode</button>

    <canvas id="canvas"></canvas>
    
    <div id="logs"></div>

    <script>
        const codecInput = document.getElementById('codecInput');
        const chunkingStrategy = document.getElementById('chunkingStrategy');
        const fileInput = document.getElementById('fileInput');
        const decodeButton = document.getElementById('decodeButton');
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const logs = document.getElementById('logs');

        function log(msg) {
            console.log(msg);
            logs.textContent += msg + '\n';
            logs.scrollTop = logs.scrollHeight;
        }

        // Generator for "Split by 0x00000001"
        function* extractChunksBy4Byte(buffer) {
            const view = new Uint8Array(buffer);
            let start = -1;
            for (let i = 0; i < view.length - 3; i++) {
                if (view[i] === 0 && view[i+1] === 0 && view[i+2] === 0 && view[i+3] === 1) {
                    if (start !== -1) {
                        yield view.slice(start, i);
                    }
                    start = i;
                }
            }
            if (start !== -1 && start < view.length) {
                yield view.slice(start);
            }
        }

        // Generator for "Group into Access Units (H.264 Heuristic)"
        function* extractAccessUnitsH264(buffer) {
            const view = new Uint8Array(buffer);
            
            function findNextStartCode(offset) {
                for (let j = offset; j < view.length - 2; j++) {
                    if (view[j] === 0 && view[j+1] === 0) {
                        if (view[j+2] === 1) return { index: j, length: 3 };
                        if (j < view.length - 3 && view[j+2] === 0 && view[j+3] === 1) return { index: j, length: 4 };
                    }
                }
                return null;
            }

            let currentStart = findNextStartCode(0);
            if (!currentStart) {
                yield view.slice(0);
                return;
            }

            let auStart = currentStart.index;
            let hasVCL = false;

            while (currentStart) {
                let nextStart = findNextStartCode(currentStart.index + currentStart.length);
                let naluType = view[currentStart.index + currentStart.length] & 0x1F;
                let isVCL = (naluType >= 1 && naluType <= 5);
                
                let isNewAU = false;
                if (hasVCL) {
                    // SEI, SPS, PPS, AUD
                    if (naluType === 6 || naluType === 7 || naluType === 8 || naluType === 9) {
                        isNewAU = true;
                    } else if (isVCL && currentStart.length === 4) {
                        // Assuming 4-byte start code means new frame
                        isNewAU = true;
                    }
                }

                if (isNewAU) {
                    yield view.slice(auStart, currentStart.index);
                    auStart = currentStart.index;
                    hasVCL = false;
                }

                if (isVCL) hasVCL = true;

                currentStart = nextStart;
            }

            if (auStart < view.length) {
                yield view.slice(auStart);
            }
        }

        async function processBitstream() {
            if (!fileInput.files.length) {
                log('Error: Please select a file first.');
                return;
            }

            const codec = codecInput.value.trim();
            const strategy = chunkingStrategy.value;
            const file = fileInput.files[0];
            
            logs.textContent = '';
            log(`Reading file: ${file.name} (${file.size} bytes)`);

            let buffer;
            try {
                buffer = await file.arrayBuffer();
                log('File read successfully.');
            } catch (e) {
                log(`Error reading file: ${e.message}`);
                return;
            }

            // Configure VideoDecoder
            let frameCount = 0;
            let decoder;
            let isFirstFrame = true;

            const init = {
                output: (frame) => {
                    frameCount++;
                    if (isFirstFrame) {
                        canvas.width = frame.displayWidth;
                        canvas.height = frame.displayHeight;
                        isFirstFrame = false;
                        log(`First frame decoded. Resolution: ${frame.displayWidth}x${frame.displayHeight}`);
                    }
                    ctx.drawImage(frame, 0, 0, canvas.width, canvas.height);
                    frame.close();
                },
                error: (e) => {
                    log(`Decoder Error: ${e.message}`);
                }
            };

            decoder = new VideoDecoder(init);
            
            const config = {
                codec: codec,
            };

            // Set annexb format for AVC/HEVC if applicable
            if (codec.startsWith('avc1')) {
                config.avc = { format: 'annexb' };
            } else if (codec.startsWith('hvc1') || codec.startsWith('hev1')) {
                config.hevc = { format: 'annexb' };
            }

            log(`Configuring decoder with config: ${JSON.stringify(config)}`);
            try {
                const support = await VideoDecoder.isConfigSupported(config);
                if (!support.supported) {
                    log(`Warning: Configuration may not be supported by this browser.`);
                }
                decoder.configure(config);
            } catch (e) {
                log(`Configure Error: ${e.message}`);
                return;
            }

            // Extract and feed chunks
            let chunksGenerator;
            if (strategy === 'split_4byte') {
                chunksGenerator = extractChunksBy4Byte(buffer);
            } else if (strategy === 'h264_heuristic') {
                chunksGenerator = extractAccessUnitsH264(buffer);
            } else {
                chunksGenerator = [new Uint8Array(buffer)];
            }

            let timestamp = 0;
            const fps = 30;
            const duration = 1_000_000 / fps;

            log(`Extracting chunks and decoding...`);
            let chunkCount = 0;
            for (const chunkData of chunksGenerator) {
                if (chunkData.length === 0) continue;
                
                const chunk = new EncodedVideoChunk({
                    type: 'key', // Assume key frame for simplicity, or we could parse
                    timestamp: timestamp,
                    duration: duration,
                    data: chunkData
                });
                
                try {
                    decoder.decode(chunk);
                    chunkCount++;
                    timestamp += duration;
                } catch (e) {
                    log(`Decode Error on chunk ${chunkCount}: ${e.message}`);
                }
                
                // Yield to event loop to allow rendering
                if (chunkCount % 30 === 0) {
                    await new Promise(r => setTimeout(r, 0));
                }
            }

            log(`Finished feeding ${chunkCount} chunks. Flushing decoder...`);
            await decoder.flush();
            log(`Decoder flushed. Total frames decoded: ${frameCount}`);
            decoder.close();
        }

        decodeButton.addEventListener('click', processBitstream);
    </script>
</body>
</html>
