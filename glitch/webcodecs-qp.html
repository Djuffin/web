<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <title>WebCodecs Per-Frame QP Bitrate Enforcement</title>
  <style>
    #dst {
      padding: 5px;
      background: gold;
    }

    #src {
      padding: 5px;
      background: blue;
    }

    input[type="range"] {
      width: 800px;
    }
  </style>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-4bw+/aepP/YC94hEpVNVgiZdgIC5+VKNBQNGCHeKRQN+PtmoHDEXuppvnDJzQIu9" crossorigin="anonymous">
</head>

<body>
  <div>
    <div>
      <div>
        Codec:
        <select id="codec">
          <option value="vp09.00.10.08">VP9</option>
          <option value="av01.0.04M.08" >AV1 lvl4</option>
          <option value="avc1.640028" selected>h264 main</option>
        </select>
      </div>
      <div>
        Bitrate mode:
        <select id="bitrate-mode">
          <option value="constant" >CBR</option>
          <option value="quantizer" selected> QP</option>
        </select>
      </div>
      <div>
        <div>Bitrate: <span id="bitrate-value">100M bps</span></div>
        <span>100 kbps</span>
        <input type="range" id="bitrate" min="100000" max="4000000" value="1000000"/>
        <span>4 mps</span>
      </div>
      <div>
        Size:
        <select  id="dims">
          <option value="{ &quot;width&quot;:320,  &quot;height&quot;:240 }">320 x 240</option>
          <option value="{ &quot;width&quot;:640,  &quot;height&quot;:360 }">640 x 360</option>
          <option value="{ &quot;width&quot;:720,  &quot;height&quot;:480 }" selected>720 x 480</option>
          <option value="{ &quot;width&quot;:1280, &quot;height&quot;:720 }" >1280 x 780</option>
        </select>
      </div>
      <div>
        Frame source:
        <select  id="source">
          <option value="camera" >Camera</option>
          <option value="canvas" selected >Generated</option>
        </select>
      </div>
      <div>
        <button class="btn mb-2 btn-primary" onclick="main()">Start</button>
        <button class="btn mb-2 btn-primary" onclick="oscillate()">Oscillate bitrate</button>
      </div>
    </div>
    <canvas id="src"></canvas>
    <canvas id="dst"></canvas>
    <canvas id="gen" style="display: none;"></canvas>
  </div>
  <div id="chart_div" style="width: 1000px; height: 500px;"></div>
  <script src="https://cdn.plot.ly/plotly-2.18.2.min.js"></script>
  <script>
    'use strict';

    class Demo {
      constructor(settings, src_cnv, dst_cnv, chart) {
        this.codec = settings.codec;
        this.width = settings.width;
        this.height = settings.height;
        this.fps = settings.fps;
        this.mode = settings.mode;
        this.qp = 30;
        this.src_ctx = src_cnv.getContext("2d");
        this.dst_ctx = dst_cnv.getContext("2d");
        this.bitrate = settings.bitrate;
        this.chunks = [];
        this.chunk_counter = 0;

        src_cnv.width = dst_cnv.width = settings.width;
        src_cnv.height = dst_cnv.height = settings.height;

        this.encoder_config = {
          codec: settings.codec,
          width: settings.width,
          height: settings.height,
          bitrate: settings.bitrate,
          bitrateMode: settings.mode,
          framerate: settings.fps,
          latencyMode: "realtime",
          hardwareAcceleration :"prefer-hardware"
        };

        if (settings.codec.startsWith("avc"))
          this.encoder_config.avc = { format: "annexb" };

        let init = {
          output: (chunk, config) => {
            this.onChunk(chunk, config);
          },
          error: (e) => { this.onError(e); }
        };
        this.encoder = new VideoEncoder(init);
        this.encoder.configure(this.encoder_config);

        init = {
          output: (frame) => { this.onDecodedFrame(frame); },
          error: (e) => { this.onError(e); }
        };

        this.decoder = new VideoDecoder(init);
        this.setupPlot(chart);
      }

      setupPlot(chart) {
        this.chart = chart;
        let layout = {
          title: 'Bitrate desired vs actual',
          xaxis: {
            autorange: true,
            type: 'daterange'
          },
          yaxis: {
            autorange: true,
            type: 'linear'
          }
        };

        let time = new Date();
        let desired_bitrate = {
            x: [time],
            y: [this.bitrate],
            name: 'Desired bitrate',
        };

        let actual_bitrate = {
            x: [time],
            y: [0],
            name: 'Actual bitrate',
        };
        let data = [desired_bitrate, actual_bitrate];
        Plotly.newPlot(chart, data, layout);
      }

      updatePlot() {
        const bitrate_measure_interval_frames = this.fps / 2;
        if (this.chunk_counter % bitrate_measure_interval_frames != 0) {
          return;
        }
        let time = new Date();
        let actual_bytes_per_second = 0;
        for (let chunk of this.chunks.slice(-bitrate_measure_interval_frames)) {
          actual_bytes_per_second += chunk.byteLength;
        }

        const bps = actual_bytes_per_second / bitrate_measure_interval_frames * this.fps * 8;

        let update = {
          x: [[time], [time]],
          y: [[this.bitrate], [bps]]
        }

        Plotly.extendTraces(this.chart, update, [0,1], 100);
      }

      setBitrate(bitrate) {
        this.bitrate = bitrate;
        this.encoder_config.bitrate = bitrate;
        if (this.mode != 'quantizer') {
          this.encoder.configure(this.encoder_config);
        }
        console.log(`Bitrate: ${bitrate}`);
      }

      pushFrame(frame) {
        let insert_keyframe = false;
        let encode_options = { keyFrame: insert_keyframe };
        if (this.codec.includes("vp09")) {
          encode_options.vp9 = { quantizer : this.qp };
        } else if (this.codec.includes("av01")) {
          encode_options.av1 = { quantizer : this.qp };
        } else if (this.codec.includes("avc")) {
          encode_options.avc = { quantizer : this.qp };
        }
        this.encoder.encode(frame, encode_options);
        this.src_ctx.drawImage(frame, 0, 0);
        frame.close();
      }

      onError(e) {
        console.log(e.message);
      }

      clamp_qp(x) {
        const min = 3;
        let max = 1;
        if (this.codec.includes("vp09")) {
          max = 63;
        } else if (this.codec.includes("av01")) {
          max = 63;
        } else if (this.codec.includes("avc")) {
          max = 51;
        }

        return Math.min(Math.max(x, min), max);
      };

      adjustQp() {
        if (this.mode != 'quantizer')
          return;

        const frames_to_consider = 4;
        const frame_budget_bytes = (this.bitrate / this.fps) / 8;
        const impact_ratio = [1.0 / 8, 1.0 / 8, 1.0 / 4, 1.0 / 2];

        if (this.chunks.length < frames_to_consider) {
          return;
        }
        let chunks = this.chunks.slice(-frames_to_consider);
        let normalized_chunk_size = 0;
        for (let i = 0; i < frames_to_consider; i++)
          normalized_chunk_size += chunks[i].byteLength * impact_ratio[i];

        const diff_bytes = normalized_chunk_size - frame_budget_bytes;
        const diff_ratio = diff_bytes / frame_budget_bytes;

        let qp = this.qp;
        let qp_change = 0;
        // Addressing overshoot more agressively that undershoot
        // Don't change QP too much when it's already low, because it
        // changes chunk size to drastically.
        if (diff_ratio > 0.6 && qp > 15) {
          qp_change = 3;
        } else if (diff_ratio > 0.25 && qp > 5) {
          qp_change = 2;
        } else if (diff_ratio > 0.04) {
          // Overshoot by more than 4%
          qp_change = 1;
        } else if (diff_ratio < (qp < 10 ? -0.10 : -0.04)) {
          // Undershoot by more than 4% (or 10% if QP is already low)
          qp_change = -1;
        }
        qp = this.clamp_qp(qp + qp_change);

        if (qp != this.qp) {
          this.qp = qp;
          console.log(`QP: ${this.qp} diff_ratio: ${diff_ratio} qp_change: ${qp_change}`);
        }
      }

      onChunk(chunk, md) {
        let config = md.decoderConfig;
        if (config && this.decoder.state === "unconfigured") {
          config.optimizeForLatency = true;
          this.decoder.configure(config);
        }
        this.decoder.decode(chunk);

        if (chunk.type == 'key') {
          this.chunks = [];
          this.chunk_counter = 0;
        } else {
          this.chunks.push(chunk);
          this.chunk_counter++;
          if (this.chunks.length > this.fps) {
            let removed_chunk = this.chunks.shift();
            this.updatePlot();
          }
          this.adjustQp();
        }
      }

      onDecodedFrame(frame) {
        this.dst_ctx.drawImage(frame, 0, 0);
        frame.close();
      }
    }

    function rnd(x) {
      return Math.floor(Math.random() * x);
    }

    async function startDrawing(cnv) {
      var ctx = cnv.getContext('2d');

      ctx.fillStyle = "white";
      let width = cnv.width;
      let height = cnv.height;
      let cx = width / 2;
      let cy = height / 2;
      let r = Math.min(width, height) / 5;
      ctx.fillRect(0, 0, width, height);

      function noise() {
        for (let i = 0; i < 5; i++) {
            let x = rnd(width);
            let y = rnd(height);
            let w = 30;
            let h = 30;
            let color = 'rgba(' + rnd(255) + ',' + rnd(255) + ',' + rnd(255) + ',' + 1 + ')';
            ctx.fillStyle = color;
            ctx.fillRect(x, y, w, h);
        }
      }

      ctx.font = '30px Helvetica';
      const text = "Hello World! :))";
      const size = ctx.measureText(text).width;

      let drawOneFrame = function (time) {
        let angle = Math.PI * 2 * (time / 5000);
        let scale = 1 + 0.3 * Math.sin(Math.PI * 2 * (time / 7000));
        ctx.save();
        noise();

        ctx.translate(cx, cy);
        ctx.rotate(angle);
        ctx.scale(scale, scale);

        ctx.fillStyle = "hsl(" + (angle * 40 ) + ",80%,50%)";
        ctx.fillRect(-size / 2, 10, size, 25);

        ctx.fillStyle = 'black';
        ctx.fillText(text, -size / 2, 0);

        ctx.restore();
        window.requestAnimationFrame(drawOneFrame);
      }
      window.requestAnimationFrame(drawOneFrame);
    }

    let demo = null;
    async function main() {
      if (!("VideoEncoder" in window)) {
        document.body.innerHTML = "<h1>WebCodecs API is not supported.</h1>";
        return;
      }

      const codec = document.getElementById('codec').value;
      const fps = 30;
      const dims = JSON.parse(document.getElementById('dims').value);
      const bitrate = Number.parseInt(document.getElementById('bitrate').value);
      const mode = document.getElementById('bitrate-mode').value;
      let bitrate_input = document.getElementById('bitrate');
      bitrate_input.addEventListener("change", (event) => {
        const formatter = Intl.NumberFormat('en', { notation: 'compact' });
        const bitrate = Number.parseInt(event.target.value);
        demo.setBitrate(bitrate);
        document.getElementById('bitrate-value').innerText = formatter.format(bitrate) + ' bps';
      });

      let constraints = { audio: false, video:
                 { width: dims.width, height: dims.height, frameRate: fps } };

      let stream = null;
      if (document.getElementById('source').value == 'camera') {
        stream = await window.navigator.mediaDevices.getUserMedia(constraints);
      } else {
        let gen_cnv = document.getElementById("gen");
        gen_cnv.width = dims.width;
        gen_cnv.height = dims.height;
        startDrawing(gen_cnv);
        stream = gen_cnv.captureStream(fps);
      }
      let track = stream.getTracks()[0];

      const media_processor = new MediaStreamTrackProcessor(track);
      const reader = media_processor.readable.getReader();

      let src_cnv = document.getElementById("src");
      let dst_cnv = document.getElementById("dst");
      demo = new Demo({codec, width:dims.width, height:dims.height, fps, bitrate, mode},
                      src_cnv, dst_cnv, 'chart_div');

      while(true) {
        const result = await reader.read();
        if (result.done)
          break;
        let frame = result.value;
        demo.pushFrame(frame);
      }
    }

    function timeout(ms) {
      return new Promise(resolve => setTimeout(resolve, ms));
    }

    async function oscillate() {
      let bitrate_input = document.getElementById('bitrate');
      for (let bps = 100000; bps < 4000000; bps += 100000) {
        bitrate_input.value = bps;
        bitrate_input.dispatchEvent(new Event('change'));
        await timeout(500);
      }

      for (let bps = 4000000; bps >= 100000 ; bps -= 100000) {
        bitrate_input.value = bps;
        bitrate_input.dispatchEvent(new Event('change'));
        await timeout(500);
      }

    }

  </script>

</body>

</html>
